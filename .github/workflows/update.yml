name: Update LootRadar Arrivals

on:
  schedule:
    # Hourly UTC checks let the configured primary airport's local-time guard
    # work across time zones and daylight-saving transitions.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Re-send notifications even for already-seen flights'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: lootrada-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check local schedule and freshness
        id: schedule_guard
        if: github.event_name == 'schedule'
        run: |
          python3 scripts/arrival_schedule.py >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_update == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_update == 'true'
        run: pip install -r requirements.txt

      - name: Run LootRadar update pipeline
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_update == 'true'
        env:
          FLIGHTAWARE_API_KEY: ${{ secrets.FLIGHTAWARE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/update_arrivals.py

      - name: Commit and push updated data
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_update == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/arrivals.json data/seen_flights.json data/photo_cache.json data/api_usage_ledger.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update arrivals data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
