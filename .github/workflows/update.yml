name: Update LootRadar Arrivals

on:
  schedule:
    # 00:30 UTC = 7:30 PM EST / 8:30 PM EDT — captures next-day tail assignments
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Re-send notifications even for already-seen flights'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LootRadar update pipeline
        env:
          AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
          AERODATABOX_API_MARKET_KEY: ${{ secrets.AERODATABOX_API_MARKET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/update_arrivals.py

      - name: Commit and push updated data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/arrivals.json data/seen_flights.json data/photo_cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update arrivals data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
