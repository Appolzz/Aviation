name: Update LootRadar Arrivals

on:
  schedule:
    # Retry every 10 minutes around the 10 PM local window, away from :00.
    # Three UTC hours cover 10–11 PM local across DST; the local guard filters them.
    - cron: '*/10 2,3,4 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Re-send notifications even for already-seen flights'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: lootrada-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check local schedule and freshness
        id: schedule_guard
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York"))
          meta = json.loads(Path("data/arrivals.json").read_text(encoding="utf-8")).get("_meta", {})
          generated_local = str(meta.get("last_updated_local", ""))
          fresh = (
              meta.get("target_date") == (now.date() + timedelta(days=1)).isoformat()
              and generated_local[:10] == now.date().isoformat()
              and meta.get("fetch_complete") is True
          )
          run_update = 22 <= now.hour <= 23 and not fresh
          print(f"run_update={'true' if run_update else 'false'}")
          PY

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LootRadar update pipeline
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_update == 'true'
        env:
          FLIGHTAWARE_API_KEY: ${{ secrets.FLIGHTAWARE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/update_arrivals.py

      - name: Commit and push updated data
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_update == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/arrivals.json data/seen_flights.json data/photo_cache.json data/api_usage_ledger.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update arrivals data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
