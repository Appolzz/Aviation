name: Update LootRadar Arrivals

on:
  schedule:
    # GitHub cron is UTC. Two slots cover 10 PM America/New_York across DST;
    # the guard below allows only the slot that is actually 10 PM local.
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Re-send notifications even for already-seen flights'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: lootrada-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check local schedule
        id: schedule_guard
        if: github.event_name == 'schedule'
        run: |
          local_hour="$(TZ=America/New_York date +%H)"
          if [ "$local_hour" = "22" ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run LootRadar update pipeline
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_update == 'true'
        env:
          FLIGHTAWARE_API_KEY: ${{ secrets.FLIGHTAWARE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/update_arrivals.py

      - name: Commit and push updated data
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.run_update == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/arrivals.json data/seen_flights.json data/photo_cache.json data/api_usage_ledger.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update arrivals data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
